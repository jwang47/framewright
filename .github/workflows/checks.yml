name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/luts.test.mjs tests/segment.test.mjs tests/raw-worker.test.mjs
      - run: python tools/check_release.py --all
      - name: Full RAW browser smoke
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          STUDIO_RAW_SMOKE: '1'
        run: python -m unittest discover -s tests -p test_raw_smoke.py -v
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/check_artifacts.py
      - run: python tools/smoke_install.py
